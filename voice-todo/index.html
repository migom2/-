<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>말하는 오늘의 투두리스트</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">🎙️ 말하는 투두리스트</div>
        <div class="tag" id="today-tag"></div>
      </header>

      <section class="mic-card">
        <button id="mic-btn" class="mic-btn" type="button" aria-pressed="false">
          <span class="mic-icon">🎤</span>
        </button>
        <p class="mic-hint" id="mic-hint">버튼을 누르고 할 일을 말해보세요</p>
        <p class="interim" id="interim" aria-live="polite"></p>
      </section>

      <form id="manual-form" class="manual-form">
        <input
          id="manual-input"
          class="manual-input"
          type="text"
          placeholder="또는 직접 입력하고 Enter"
          autocomplete="off"
        />
        <button type="submit" class="add-btn">추가</button>
      </form>

      <section class="list-card">
        <div class="list-head">
          <h2>오늘 할 일</h2>
          <span class="progress" id="progress">0/0</span>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty-msg" class="empty-msg">아직 할 일이 없어요. 말해보세요!</p>
        <button id="clear-done-btn" class="clear-btn" type="button">완료된 항목 지우기</button>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
