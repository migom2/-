<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>감사 일기장</title>
    <meta name="description" content="긴 색종이에 감사한 일을 적으면 입체 종이별로 접혀 유리병에 쌓이는 감사 일기장." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫙</text></svg>" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@500;600&family=Gaegu:wght@400;700&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">🫙 감사 일기장</div>
        <div class="tag" id="jar-count">아직 채워진 별이 없어요</div>
      </header>

      <section class="jar-card">
        <div class="jar" id="jar">
          <div class="jar-ground-shadow"></div>
          <div class="jar-stars" id="jar-stars"></div>

          <svg class="jar-svg" viewBox="0 0 240 340" aria-hidden="true">
            <defs>
              <linearGradient id="glass-grad" x1="0%" y1="0%" x2="20%" y2="100%">
                <stop offset="0%" stop-color="#ede4fb" stop-opacity="0.22" />
                <stop offset="55%" stop-color="#d5c3f3" stop-opacity="0.2" />
                <stop offset="100%" stop-color="#b39ce2" stop-opacity="0.34" />
              </linearGradient>
              <linearGradient id="lid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#f6effc" />
                <stop offset="100%" stop-color="#cbabe8" />
              </linearGradient>
              <filter id="jar-wobble" x="-15%" y="-15%" width="130%" height="130%">
                <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="4" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
              </filter>
            </defs>

            <ellipse class="jar-pool" cx="120" cy="296" rx="64" ry="16" />

            <g filter="url(#jar-wobble)">
              <path
                class="jar-glass"
                d="M 76 46
                   C 55 46 42 60 42 100
                   L 42 258
                   C 42 296 64 314 120 314
                   C 176 314 198 296 198 258
                   L 198 100
                   C 198 60 185 46 164 46
                   Z"
              />
              <rect class="jar-lid" x="70" y="14" width="100" height="32" rx="11" />
              <ellipse class="jar-lid-top" cx="120" cy="14" rx="50" ry="8" />
              <line class="jar-thread" x1="76" y1="24" x2="164" y2="24" />
              <line class="jar-thread" x1="76" y1="32" x2="164" y2="32" />
              <line class="jar-thread" x1="76" y1="40" x2="164" y2="40" />
            </g>

            <path class="jar-shine-broad" d="M 66 108 C 60 160 60 220 68 266" />
            <path class="jar-shine-thin" d="M 92 118 C 88 168 88 218 94 254" />
            <path class="jar-shine-lid" d="M 88 20 C 96 26 112 29 120 29" />
          </svg>
        </div>
        <p class="jar-hint">색종이에 감사를 적어 별을 접어보세요</p>
      </section>

      <div class="action-row">
        <button id="write-btn" class="primary-btn" type="button">✏️ 감사일기 쓰기</button>
        <button id="draw-btn" class="ghost-btn" type="button" disabled>⭐ 별 꺼내보기</button>
      </div>
    </div>

    <!-- 작성 모달 -->
    <div class="modal-overlay" id="write-modal" hidden>
      <div class="modal-card" id="write-card" data-stage="write">
        <button class="modal-close" id="write-close" type="button" aria-label="닫기">✕</button>

        <div class="stage stage-write">
          <h2>오늘 감사한 일을 적어보세요</h2>
          <p class="modal-desc">긴 색종이에 한 줄씩 적으면 종이별로 접혀 유리병에 담겨요.</p>

          <div class="strip-input-wrap">
            <span class="strip-glyph">✱</span>
            <textarea
              id="entry-input"
              class="entry-input"
              rows="2"
              maxlength="120"
              placeholder="예: 오늘 점심에 먹은 김치찌개가 맛있었다"
            ></textarea>
            <span class="strip-date-corner" id="entry-date"></span>
          </div>

          <ul class="strip-list" id="pending-list"></ul>

          <div class="modal-btn-row">
            <button id="add-more-btn" class="secondary-btn" type="button">➕ 추가로 적기</button>
            <button id="done-btn" class="secondary-btn" type="button">완료</button>
          </div>
        </div>

        <div class="stage stage-review">
          <h2>별이 될 준비가 됐어요</h2>
          <p class="modal-desc"><span id="review-count">0</span>개의 색종이가 별로 접힐 거예요.</p>
          <ul class="strip-list" id="review-list"></ul>
          <div class="modal-btn-row">
            <button id="back-to-write-btn" class="secondary-btn" type="button">✏️ 다시 쓰기</button>
            <button id="save-jar-btn" class="primary-btn" type="button">🫙 유리병에 저장하기</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 별 꺼내기 모달 -->
    <div class="modal-overlay" id="draw-modal" hidden>
      <div class="modal-card star-reveal">
        <button class="modal-close" id="draw-close" type="button" aria-label="닫기">✕</button>
        <div class="reveal-star" id="reveal-star"></div>
        <p class="reveal-date" id="reveal-date"></p>
        <p class="reveal-text" id="reveal-text"></p>
        <div class="modal-btn-row">
          <button id="draw-again-btn" class="secondary-btn" type="button">🔀 다른 별 뽑기</button>
          <button id="reveal-delete-btn" class="danger-btn" type="button">🗑 지우기</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
